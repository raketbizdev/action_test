name: Complex CI/CD Workflow

on:
  push:
    branches:
      - dev

jobs:
  # Job 1: Lint the code (runs in parallel with Build)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

  # Job 2: Build the application (runs in parallel with Lint)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Build the application
        run: npm run build

  # Job 3: Run tests (uses matrix for parallel testing on different configurations)
  test:
    runs-on: ${{ matrix.os }}
    needs: [lint, build]  # Run after Lint and Build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [12, 14, 16]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # Job 4: Deploy (runs sequentially after tests pass)
  deploy:
    runs-on: ubuntu-latest
    needs: test  # Run after all test matrix jobs complete
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy application
        run: echo "Deploying the application..."
