name: Complex CI/CD Workflow

on:
  push:
    branches:
      - dev

jobs:
  # Job 1: Lint the code (runs in parallel with Build)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 1
        run: echo "Run lint 1"
      - name: Checkout code 2
        run: echo "Run lint 2"
      - name: Checkout code 3
        run: echo "Run lint 3"

  # Job 2: Build the application (runs in parallel with Lint)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build code 1
        run: echo "Building code 1"
      - name: Build code 2
        run: echo "Building code 2"
      - name: Build code 3
        run: echo "Building code 3"
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Code Review
        run: echo "Code Review 1"
      - name: Build Review 2
        run: echo "Code Review 2"
      - name: Build Review 3
        run: echo "Code Review 3"

  # Job 3: Unit tests (Matrix for OS and Node.js versions)
  unit-test:
    runs-on: ${{ matrix.os }}
    needs: [lint, build]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [12, 14, 16]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:unit

  # Job 4: Integration tests (Matrix for OS and Node.js versions)
  integration-test:
    runs-on: ${{ matrix.os }}
    needs: [lint, build]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [14, 16]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run integration tests
        run: npm run test:integration

  # Job 5: API tests (Matrix for OS and Node.js versions)
  api-test:
    runs-on: ${{ matrix.os }}
    needs: [lint, build]
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [16]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run API tests
        run: npm run test:api

  # Job 6: Deploy (runs sequentially after all tests pass)
  deploy:
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test, api-test]  # Run after all test jobs complete
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy application
        run: echo "Deploying the application..."
