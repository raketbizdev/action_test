name: CI/CD Prosperna Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  pre-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Lint Test
        run: make lint
      
      - name: Dependency Check
        run: make dependency-check
      
      - name: Vulnerability Check
        run: make vuln-check
      
      - name: SAST Scan
        run: make sast-scan
      
      - name: Upload S3 Assets
        run: make upload-assets
      
      - name: Code Review
        run: make code-review
      
      - name: Unit Test
        run: make test

  test:
    runs-on: ubuntu-latest
    needs: pre-checks
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Run API Tests
        run: make api-test
      
      - name: Run Integration Tests
        run: make integration-test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Build Application
        run: make build
      
      - name: Save Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: build-artifact
          path: build/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Download Build Artifact
        uses: actions/download-artifact@v3
        with:
          name: build-artifact
          path: build/
      
      - name: Deploy to AWS ECS
        run: make deploy
