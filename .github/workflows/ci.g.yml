name: Workflow G

on:
  push:
    branches:
      - dev

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1: Run Action
        uses: actions/checkout@v3
        
      - name: Step 2: Run Script
        run: echo "Running script step 2"

      - name: Step 3: Run Script
        run: echo "Running script step 3"
        
      - name: Step 4: Run Action
        uses: actions/setup-node@v3
        with:
          node-version: '16'

  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: 
            Step 1: Run Action
        uses: actions/checkout@v3

      - name: Step 2: Run Script
        run: echo "Running script step 2 in Job 2"

      - name: Step 3: Run Script
        run: echo "Running script step 3 in Job 2"
